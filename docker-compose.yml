version: '3.8'

services:
  trading-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8765
      - SESSION_TOKEN=secure-cloud-token-2026
      - SYMBOL=BTCUSDT
      - TIMEFRAME=5M
      - INITIAL_BALANCE=10000
    restart: unless-stopped
