<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>داشبورد کنترل نود معاملاتی | AI Trading System</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #131b2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 1.5rem; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    .config-panel { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .config-panel input { background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 0.5rem 0.75rem; border-radius: 4px; flex: 1; min-width: 200px; }
    .config-panel button { background: var(--accent-blue); color: #fff; border: none; padding: 0.5rem 1.25rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.25rem; }
    .card h3 { margin-bottom: 1rem; font-size: 1.1rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    #status-container, #kill-switch-container { margin-bottom: 1rem; }
    #audit-feed-container { max-height: 400px; overflow-y: auto; }
    .emergency-btn { width: 100%; padding: 0.85rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 style="font-size: 1.5rem;">سامانه معاملاتی خودکار (AI Trading System)</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;">کنترل دسکتاپ نود و ممیزی رمزنگاری‌شده (حالت شبیه‌سازی Paper)</p>
      </div>
      <div id="connection-indicator" style="color: var(--text-muted); font-size: 0.9rem;">در انتظار اتصال...</div>
    </header>

    <div class="config-panel">
      <label for="node-url-input" style="font-size: 0.9rem;">آدرس نود معاملاتی:</label>
      <input type="text" id="node-url-input" value="http://127.0.0.1:8765" placeholder="http://127.0.0.1:8765">
      <input type="password" id="token-input" value="local-secure-token-2026" placeholder="Session Token">
      <button id="connect-btn">اتصال به نود</button>
    </div>

    <div class="grid">
      <div class="card">
        <h3>وضعیت سلامت و تلمتری نود</h3>
        <div id="status-container"></div>
        <div id="kill-switch-container"></div>
      </div>

      <div class="card">
        <h3>لجر ممیزی رویدادها (Tamper-Evident SHA-256)</h3>
        <div id="audit-feed-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/web-app.ts"></script>
</body>
</html>
