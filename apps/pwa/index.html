<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>سامانه معاملاتی هوش مصنوعی | AI Trading System</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #131b2e;
      --bg-input: #0f172a;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }

    /* Auth Page */
    #auth-page { display: flex; }
    #app-page { display: none; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; text-align: center; }
    .auth-card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .auth-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .auth-card input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; font-size: 1rem; }
    .auth-card input::placeholder { color: var(--text-muted); }
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-primary { background: var(--accent-blue); color: #fff; margin-bottom: 0.5rem; }
    .btn-secondary { background: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-error { color: var(--accent-red); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }
    .auth-toggle { color: var(--text-muted); font-size: 0.85rem; margin-top: 1rem; }
    .auth-toggle a { color: var(--accent-blue); cursor: pointer; text-decoration: underline; }

    /* App Page */
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    header h1 { font-size: 1.25rem; }
    .user-bar { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text-muted); }
    .user-bar button { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    /* Cards */
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 1.25rem; }
    .card h3 { margin-bottom: 0.75rem; font-size: 0.95rem; color: var(--text-muted); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat-item { text-align: center; }
    .stat-value { font-size: 1.3rem; font-weight: bold; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .stat-green { color: var(--accent-green); }
    .stat-red { color: var(--accent-red); }
    .stat-amber { color: var(--accent-amber); }

    /* Status Badge */
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
    .status-running { background: rgba(16,185,129,0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .status-idle { background: rgba(245,158,11,0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .status-stopped { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

    /* Buttons */
    .engine-controls { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .engine-controls button { flex: 1; padding: 0.6rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-start { background: var(--accent-green); color: #fff; }
    .btn-pause { background: var(--accent-amber); color: #000; }
    .btn-stop { background: var(--accent-red); color: #fff; }

    /* Audit Feed */
    .audit-list { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
    .audit-item { font-family: monospace; font-size: 0.75rem; padding: 6px 0; border-bottom: 1px solid var(--border-color); color: var(--text-muted); }
    .audit-action { font-weight: bold; color: var(--text-main); }
    .audit-hash { color: var(--accent-blue); font-size: 0.65rem; }
    .audit-empty { color: var(--text-muted); text-align: center; padding: 2rem; font-size: 0.85rem; }

    /* Sync indicator */
    .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 4px; }
    .sync-active { background: var(--accent-green); animation: pulse 2s infinite; }
    .sync-offline { background: var(--text-muted); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div class="container">
    <!-- ===== AUTH PAGE ===== -->
    <div id="auth-page">
      <div class="auth-card">
        <h1>🤖 سامانه معاملاتی AI</h1>
        <p>حالت شبیه‌سازی Paper — ورود یا ثبت‌نام</p>
        <input type="email" id="auth-email" placeholder="ایمیل" autocomplete="email">
        <input type="password" id="auth-password" placeholder="رمز عبور" autocomplete="current-password">
        <button class="btn btn-primary" id="auth-signin-btn">ورود</button>
        <button class="btn btn-secondary" id="auth-signup-btn">ثبت‌نام</button>
        <div class="auth-error" id="auth-error"></div>
      </div>
    </div>

    <!-- ===== APP PAGE ===== -->
    <div id="app-page">
      <header>
        <div>
          <h1>داشبورد معاملاتی</h1>
        </div>
        <div class="user-bar">
          <span id="user-email"></span>
          <span class="sync-dot sync-active" id="sync-dot" title="سینک ابری فعال"></span>
          <button id="signout-btn">خروج</button>
        </div>
      </header>

      <!-- Engine Status -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3>وضعیت موتور</h3>
          <span id="engine-status" class="status-badge status-idle">● IDLE</span>
        </div>
        <div class="stats-grid" style="margin-top: 1rem;">
          <div class="stat-item">
            <div class="stat-value stat-green" id="stat-equity">$10,000.00</div>
            <div class="stat-label">سرمایه (Equity)</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-balance">$10,000.00</div>
            <div class="stat-label">موجودی (Balance)</div>
          </div>
          <div class="stat-item">
            <div class="stat-value stat-red" id="stat-loss">$0.00</div>
            <div class="stat-label">ضرر روزانه</div>
          </div>
          <div class="stat-item">
            <div class="stat-value stat-amber" id="stat-trades">0</div>
            <div class="stat-label">تعداد معاملات</div>
          </div>
        </div>
        <div class="engine-controls">
          <button class="btn-start" id="btn-start">▶ شروع</button>
          <button class="btn-pause" id="btn-pause">⏸ توقف موقت</button>
          <button class="btn-stop" id="btn-stop">🛑 توقف اضطراری</button>
        </div>
      </div>

      <!-- Audit Trail -->
      <div class="card">
        <h3>لجر ممیزی رمزنگاری‌شده (SHA-256)</h3>
        <div id="audit-feed">
          <div class="audit-empty">هنوز رکوردی ثبت نشده است.</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/web-app.ts"></script>
</body>
</html>
